<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아이디어 랩 | 회의 대시보드</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#172332;background:#f3f5f3}*{box-sizing:border-box}body{margin:0}header{background:#172c29;color:#fff;padding:28px max(5vw,24px)}header small{letter-spacing:.15em;color:#a8d0bd}h1{margin:12px 0 6px;font-size:30px}header p{margin:0;color:#bdcec5}main{max-width:1300px;margin:auto;padding:26px 24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pill{border-radius:30px;padding:7px 13px;background:#d8eadd;color:#225c40;font-size:13px;font-weight:700}.grid{display:grid;grid-template-columns:1.1fr 2fr;gap:20px;margin-top:20px}.panel{background:white;border:1px solid #dce3dd;border-radius:16px;padding:22px;margin-bottom:18px}h2{font-size:17px;margin:0 0 18px}h3{font-size:16px;margin:0 0 8px}.muted{color:#687770;font-size:13px;line-height:1.6}.agent{padding:14px 0;border-top:1px solid #eef1ee}.agent:first-of-type{border-top:0}.row{display:flex;justify-content:space-between;gap:12px}.status{font-size:12px;color:#47705b;white-space:nowrap}.timeline{border-left:2px solid #dceae0;margin-left:7px;padding-left:22px}.event{position:relative;padding:0 0 23px}.event:before{content:'';position:absolute;left:-29px;top:3px;width:12px;height:12px;border-radius:50%;background:#4e8c68;border:2px solid white}.event p{line-height:1.65;margin:6px 0;color:#40514a;white-space:pre-wrap}.event time{font-size:12px;color:#819088}.cards{display:grid;grid-template-columns:1fr;gap:16px}.card{padding:22px;background:#f7f9f7;border-radius:12px;border:1px solid #e2eae3}.card h3{font-size:19px;margin:12px 0}.card p{font-size:14px;color:#44564c;line-height:1.7;margin:7px 0}.card .intro{font-size:15px;color:#23392c}.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin-top:18px}.detail{padding-top:12px;border-top:1px solid #e1e9e2}.detail b{font-size:12px;color:#47715a;letter-spacing:.03em}.detail p{margin:5px 0}.data-box{margin-top:18px;padding:16px;background:#fff;border:1px solid #dfe8e1;border-radius:10px}.data-box h4{margin:0 0 8px;font-size:14px}.data-box p{font-size:13px}.data-box a{font-size:13px;overflow-wrap:anywhere}.data-state{color:#986321;font-size:12px;font-weight:700}.example{background:#edf4ee;padding:11px 14px;border-radius:8px}.sources{display:flex;gap:8px;flex-wrap:wrap}.badge{font-size:11px;background:#e6eee7;padding:4px 8px;border-radius:20px;color:#43694d}a{color:#246e4b}button{background:white;border:1px solid #ccd9cf;border-radius:8px;padding:8px 12px;cursor:pointer}.error{color:#a63b36}@media(max-width:760px){.grid,.cards,.details{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body><header><small>GRAPH RAG · IDEA LAB</small><h1>아이디어 회의실</h1><p>서로 다른 관점으로 문제를 찾고, 근거를 확인합니다.</p></header><main><div class="top"><div><strong id="meeting">회의 데이터를 불러오는 중</strong><div id="updated" class="muted"></div></div><div><span id="status" class="pill">연결 중</span> <button onclick="load()">새로고침</button></div></div><div id="error" class="error" role="status"></div><div class="grid"><aside><section class="panel"><h2>참여자</h2><div id="agents"></div></section><section class="panel"><h2>회의 방식</h2><p class="muted">독립 제안 → 데이터 확인과 비판 → 교차 검토 → 후보 정리</p><p class="muted">이 화면은 저장된 회의 기록을 10초마다 읽습니다. 실시간 에이전트 내부 화면이 아니며 기록된 내용만 표시합니다.</p></section></aside><div><section class="panel"><h2>아이디어 후보</h2><p class="muted">사용자와 기대 가치는 가설입니다. 데이터 확보 상태는 실제 확인 수준을 기준으로 표시합니다.</p><div id="ideas" class="cards"></div></section><section class="panel"><div class="row"><h2>회의 진행 기록</h2><span class="muted">최신 기록부터</span></div><div id="events" class="timeline"></div></section><section class="panel"><h2>다음 확인 사항</h2><div id="next" class="muted"></div></section></div></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{let r=await fetch('meeting.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();document.querySelector('#meeting').textContent=d.title;document.querySelector('#updated').textContent='기록 갱신: '+d.updated;document.querySelector('#status').textContent=d.status;document.querySelector('#agents').innerHTML=d.agents.map(a=>`<div class="agent"><div class="row"><strong>${esc(a.name)}</strong><span class="status">${esc(a.status)}</span></div><div class="muted">${esc(a.role)}</div></div>`).join('');document.querySelector('#events').innerHTML=d.events.map(e=>`<article class="event"><time>${esc(e.time)} · ${esc(e.actor)}</time><h3>${esc(e.title)}</h3><p>${esc(e.body)}</p></article>`).join('');document.querySelector('#ideas').innerHTML=d.ideas.map(i=>`<article class="card"><span class="badge">${esc(i.status)}</span><h3>${esc(i.name)}</h3><p class="intro">${esc(i.body)}</p>${i.target?`<div class="details"><div class="detail"><b>누가 사용하나요?</b><p>${esc(i.target)}</p></div><div class="detail"><b>어떤 문제를 해결하나요?</b><p>${esc(i.problem)}</p></div><div class="detail"><b>어떻게 사용하나요?</b><p>${esc(i.flow)}</p></div><div class="detail"><b>사용자에게 어떤 가치가 있나요?</b><p>${esc(i.value)}</p></div></div><p class="example">${esc(i.example)}</p><div class="data-box"><h4>데이터 확보 가능성</h4><span class="data-state">${esc(i.data_status)}</span><p><b>공공자료</b> · ${esc(i.data_public)}</p><p><b>사용자 제공 자료</b> · ${esc(i.data_private)}</p><p><b>아직 확인할 점</b> · ${esc(i.data_gap)}</p><div class="sources">${(i.sources||[]).filter(x=>/^https:\/\//.test(x.url)).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.label)} ↗</a>`).join('')}</div></div><div class="details"><div class="detail"><b>지금 쓰는 대안</b><p>${esc(i.baseline)}</p></div><div class="detail"><b>다음 검증</b><p>${esc(i.validation)}</p></div></div>`:`<p><b>확인할 점</b> · ${esc(i.question)}</p>`}</article>`).join('')||'<p class="muted">아직 정리된 후보가 없습니다.</p>';document.querySelector('#next').innerHTML=d.next.map(x=>`<p>→ ${esc(x)}</p>`).join('');document.querySelector('#error').textContent=''}catch(e){document.querySelector('#error').textContent='회의 기록을 불러오지 못했습니다. 로컬 서버와 meeting.json을 확인해 주세요.'}}load();setInterval(load,10000);
</script></body></html>
