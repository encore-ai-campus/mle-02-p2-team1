name = "idea_critic"
description = "서비스 아이디어를 독립적으로 검토합니다. 사용자 가치와 기존 대안, 데이터 공백, 잘못된 답변의 영향, 운영 비용을 살피고 Graph RAG가 일반 검색이나 RAG보다 필요한지 검증할 때 사용합니다."
